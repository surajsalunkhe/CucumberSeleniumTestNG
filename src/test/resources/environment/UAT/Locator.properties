##############################Login Page ####################
LOGIN_USERNAME=xpath://*[@id="loginForm"]/label[1]/input
LOGIN_PASSWORD=xpath://*[@id="loginForm"]/label[2]/input
LOGIN_BUTTON=xpath://*[@id="loginForm"]/div[1]/button
LOGOUT_BUTTON=xpath://a[contains(text(),'Log Out')]

##############################Registration Page ####################
SIGNUP_NAME_FIELD=xpath://input[@data-qa='signup-name']
SIGNUP_EMAIL_FIELD=xpath://input[@data-qa='signup-email']
SIGNUP_PASSWORD_FIELD=xpath://input[@data-qa='signup-password']
SIGNUP_BUTTON=xpath://button[contains(text(),'Signup')]
SIGNUP_SUCCESS_MESSAGE=css:.alert-success
SIGNUP_ERROR_MESSAGE=css:.alert-danger
EMAIL_EXIST_ERROR=xpath://*[contains(text(),'Email Address already exist!')]
FIELD_VALIDATION_ERROR=css:.help-block
LOGIN_SECTION=css:#form-section